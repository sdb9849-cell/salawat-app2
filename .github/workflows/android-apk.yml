name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    Ainsi, pnpm/action-setup lira automatiquement la version indiquée dans votre package.json (pnpm@9.12.0).
Vérification : Il ne reste aucune ligne version: sous uses: pnpm/action-setup@v4.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire le fichier ZIP du projet
        run: |
          unzip -o "*.zip"
          if [ ! -f package.json ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -rf "$SUBDIR"/* .
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salawat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
